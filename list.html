<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST</title>
</head>
<body>
    <h1>My List</h1>
    <h2>Unordered List</h2>
     <ul >                     <!--  style="list-style-type:square" -->
        <li>1
            <ol>
                <li>h.1</li>
                <li>h.2</li>

            </ol>
        </li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>

    <h2>Ordered List</h2>
    <ol type="i"> <!--  type="1"  type="a"  type="I" -->
        <li>one</li>
        <li>two</li>
        <li>three</li>
        <li>four</li>
        <li>five</li>
    </ol>

      <dl>                            
        <dt>Term 1</dt>
        <dd>Description 1</dd>
        <dt>Term 2</dt>
        <dd>Description 2</dd>
      </dl>


     <h3>TEST</h3>                             <!--  block level element -->
   <p>test para</p>                               <!--  block level element      -->
    <p>Lorem ipsum dolor sit amet consectetur adipisicing 
        <span>elit.</span> Velit, perferendis!</p>                  <!-- inline level element-->

</body>
</html>
