<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASS</title>
    <style>
      .red {                                     /*   . for class */
           background-color: red;
        }
        #green{                                       /*   # for id */
            background-color: green;
        }
        table {
        border-collapse: collapse;
        text-align: center;
        
    }
    td,th{
        border:1px solid black;
        padding:10px;
    }
    </style>
</head>
<body>
    <!-- 'class' is used to target multiple elements with same class name  -->

    <p class="red">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt, distinctio?</p>
    <p id="green">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Libero, minima?</p>
    <h1 class="red">Test 1</h1>
    <h3 id="green">test 2</h3>

     <table>
        <tr>
            <th >Country</th>
            <td>India</td>
            <td>Japan</td>
             <td> Class Id video </td>
        </tr>
        <tr>
            <th>Country code</th>
            <td>IN  </td>
            <td>JP</td>
            <td> 
              <iframe width="560" height="315" src="https://www.youtube.com/embed/I7LrS1z_WNA?si=L9VH6uJf-4llM5cq" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>   
            
            </td>
        </tr>
    </table> 
     


</body>
</html>
