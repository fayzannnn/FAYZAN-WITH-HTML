<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms 1</title>
    <style>
       body{ 
        background-color: #414141;
              color: #fff;
             }
    </style>
</head>
<body>
    <h1>Forms in html</h1>
      
     <form action="" method="GET"
     accept-charset="UTF-8" autocomplete="off" enctype="application/x-www-form-urlencoded" name="myform" novalidate target="_blank">
        <label for="fname">Firstname:</label>
        <input type="text" name="fname" placeholder="Enter your firstname" id="fname">
        <br/>
     <form action="" method="GET">
        <label for="lname">Lastname:</label>
        <input type="text" name="lname" placeholder="Enter your lastname" id="lname">
        <br/>

       <button type="submit">Submit</button> 
        
         

     </form>
</body>
</html>
